# Local data path: ClickHouse (findings warehouse) + Redis (block fan-out).
# Bring up:  docker compose -f docker/compose.yml up -d
# Teardown:  docker compose -f docker/compose.yml down -v
# Verify:    bunx nx run infra:smoke

name: svd-local

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12.2.29
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    # Fail loudly under memory pressure rather than thrashing the host (T04 ingest).
    mem_limit: 4g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 256m

volumes:
  clickhouse_data:
    name: svd_clickhouse_data
  redis_data:
    name: svd_redis_data
