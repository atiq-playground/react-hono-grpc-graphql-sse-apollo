syntax = "proto3";

package findings.v2;

// Dictionary-encoded string column. Indices are block-local.
message DictColumn {
  repeated string dictionary = 1;
  repeated uint32 indices = 2;
}

// Sparse optional string column (kaiStatus): only rows with a value appear.
message SparseStringColumn {
  repeated uint32 row_indices = 1;
  repeated string values = 2;
}

// Nested string arrays flattened with exclusive end offsets.
message OffsetStringArrays {
  repeated string values = 1;
  repeated uint32 offsets = 2;
}

// Columnar, bounded batch of source findings for one immutable dataset version.
message FindingBlock {
  uint64 sequence = 1;
  string dataset_version = 2;
  uint32 row_count = 3;

  repeated string group = 10;
  repeated string repo = 11;
  repeated string image = 12;

  repeated string cve = 20;
  repeated string package_name = 21;
  repeated string package_version = 22;
  repeated string path = 23;

  DictColumn severity = 30;
  DictColumn package_type = 31;
  DictColumn status = 32;
  DictColumn advisory_type = 33;
  DictColumn build_type = 34;
  DictColumn type = 35;

  repeated double cvss = 40;
  repeated string description = 41;
  repeated string cause = 42;
  repeated string exploit = 43;
  repeated string fix_date = 44;
  repeated string published = 45;
  repeated string layer_time = 46;
  repeated string link = 47;
  repeated string owner = 48;
  repeated string vec_str = 49;

  SparseStringColumn kai_status = 50;

  OffsetStringArrays risk_factors = 60;
  OffsetStringArrays applicable_rules = 61;
}

message IngestBlocksResponse {
  string dataset_version = 1;
  uint64 blocks_written = 2;
  uint64 source_rows_written = 3;
  string terminal_event_id = 4;
  uint64 current_findings = 5;
}

message ApplyChangesRequest {
  string dataset_version = 1;
  FindingBlock upserts = 2;
  repeated string delete_finding_ids = 3;
}

message ApplyChangesResponse {
  uint64 upserts_applied = 1;
  uint64 deletes_applied = 2;
  repeated string event_ids = 3;
}

service IngestService {
  // Streams bounded FindingBlocks into ClickHouse. The caller may set
  // x-ingest-replace: true to truncate the current local dataset first.
  rpc IngestBlocks(stream FindingBlock) returns (IngestBlocksResponse);

  // Applies a bounded set of current-row replacements and tombstones, then
  // publishes one versioned DatasetEvent per applied change.
  rpc ApplyChanges(ApplyChangesRequest) returns (ApplyChangesResponse);
}
